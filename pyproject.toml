[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotune"
version = "0.1.0"
description = "ML-guided autotuning research harness for Triton GPU kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "optuna>=3.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Install PyTorch from https://pytorch.org with the CUDA build matching your driver.
# On Linux, the PyTorch CUDA wheel already ships a compatible Triton.
gpu = ["torch>=2.2", "triton>=2.2"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
neurotune = "neurotune.cli:main"

[tool.setuptools.packages.find]
include = ["neurotune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU with Triton installed"]
